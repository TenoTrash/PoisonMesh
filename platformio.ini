; ============================================================
;  PoisonMesh-Cardputer  |  platformio.ini
;  Plataforma: M5Stack Cardputer ADV (ESP32-S3FN8) + Cap LoRa-1262
;
;  NOTA SOBRE EL BOARD ID:
;  El Cardputer ADV usa el chip M5StampS3A (ESP32-S3FN8).
;  PlatformIO no tiene un board ID nativo "m5stack-cardputer",
;  por lo que se usa "esp32-s3-devkitc-1" que es el board generico
;  de referencia ESP32-S3 - metodo oficial confirmado por M5Stack:
;  https://docs.m5stack.com/en/core/Cardputer-Adv
; ============================================================

[env:cardputer-adv]
platform  = espressif32 @ 6.7.0
board     = esp32-s3-devkitc-1
framework = arduino

; --- Flash / memoria (ESP32-S3FN8 = 8MB Flash, 2MB PSRAM) ---
board_build.flash_mode    = qio
board_build.flash_size    = 8MB
board_build.partitions    = default_8MB.csv
board_upload.flash_size   = 8MB

; --- Upload ---
upload_speed = 1500000
upload_port  = /dev/ttyACM0

; --- Monitor ---
monitor_speed   = 115200
monitor_port    = /dev/ttyACM0
monitor_filters = esp32_exception_decoder, colorize

; --- Build flags ---
; -DESP32S3               : identifica el MCU para M5Unified/M5GFX
; -DARDUINO_USB_CDC_ON_BOOT=1 : habilita Serial via USB-C (OBLIGATORIO en S3)
; -DARDUINO_USB_MODE=1    : activa el modo USB CDC/JTAG nativo del S3
; -DBOARD_HAS_PSRAM       : habilita el soporte PSRAM en el framework
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

; --- Librerias ---
lib_deps =
    ; Hardware M5Stack (M5Unified cubre pantalla, I2C, IMU, etc.)
    m5stack/M5Unified @ ^0.2.4
    m5stack/M5GFX     @ ^0.2.4

    ; Libreria oficial del Cardputer (teclado)
    ; Instala M5Cardputer.h que incluye el driver del teclado
    https://github.com/m5stack/M5Cardputer

    ; Radio SX1262
    jgromes/RadioLib  @ ^6.6.0

    ; Protobuf (Nanopb - runtime minimo, .pb.c/.pb.h se generan en /src/proto/)
    nanopb/Nanopb     @ ^0.4.8

; ============================================================
; INSTRUCCIONES DE INSTALACION (primera vez):
;
;  1. Instalar VS Code + extension PlatformIO IDE
;  2. Abrir esta carpeta como proyecto PlatformIO
;  3. PlatformIO descargara automaticamente la plataforma y librerias
;     (primera compilacion ~5-10 min)
;  4. Conectar la Cardputer ADV por USB-C
;  5. Seleccionar el entorno "cardputer-adv" en la barra inferior de PIO
;  6. Click en "Build" (?) luego "Upload" (?)
;
;  IMPORTANTE - Puerto Serial en ESP32-S3:
;  El Cardputer ADV usa USB CDC nativo (no UART-to-USB externo).
;  El Serial Monitor aparecera como un puerto COM virtual distinto
;  al puerto de upload. Si el monitor no conecta, reiniciar la placa
;  despues del upload presionando el boton de reset.
; ============================================================
